# Authenticated BLE management shared by targets with a supported HCI transport.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="ZephyrForge"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=28
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_RX_STACK_SIZE=4096

# Keep Bluetooth control off every shell; the authenticated BLE service owns it.
CONFIG_BT_SHELL=n
