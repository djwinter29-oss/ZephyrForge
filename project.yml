:project:
  :name: ZephyrForge Firmware Tests
  :ceedling_version: 1.1.10
  :build_root: build/ceedling
  :use_mocks: TRUE
  :release_build: FALSE

:paths:
  :test:
    - +:firmware/tests/unit/**
  :source:
    - firmware/src/**
  :include:
    - firmware/src
    - firmware/src/**

# Zephyr glue: covered by target builds and native Zephyr tests, not by host unit tests.
:files:
  :source:
    - -:firmware/src/main.c
    - -:firmware/src/board/*.c
    - -:firmware/src/led/*.c
    - -:firmware/src/sysclk/*.c
    - -:firmware/src/settings/settings_flash.c
    - -:firmware/src/telemetry/telemetry.c
    - -:firmware/src/storage/storage.c
    - -:firmware/src/storage/storage_msc.c
    - -:firmware/src/usb/usb.c
    - -:firmware/src/wireless/ble/ble.c
    - -:firmware/src/wireless/wifi/wifi.c
    - -:firmware/src/drivers/random/*.c
    - -:firmware/src/drivers/sdhc/sdhc_rpi_pico_pio.c

:defines:
  :test:
    # The Raspberry Pi Pico board build definitions.
    :test_pico_board:
      - ZF_MCU=ZF_MCU_RP2040
      - ZF_BOARD_MODEL=ZF_BOARD_PICO
      - ZF_BOARD_CAPS=0
    :test_pico_w_board:
      - ZF_MCU=ZF_MCU_RP2040
      - ZF_BOARD_MODEL=ZF_BOARD_PICO_W
      - ZF_BOARD_CAPS=ZF_CAP_WIRELESS
      - ZF_RADIO_MASK=1u
    # A hypothetical BLE-only override exercising the radio-mask half of control admission.
    :test_ble_only_board:
      - ZF_BOARD_CAPS=ZF_BOARD_CAPS_ESP32C6
      - ZF_RADIO_MASK=2u

:cmock:
  :mock_prefix: mock_
  :when_ptr: :compare_ptr
  :plugins:
    - ignore
    - ignore_arg
    - return_thru_ptr
    - expect_any_args
    - callback

:flags:
  :test:
    :compile:
      :*:
        - -std=c11
        - -Wall
        - -Wextra
        - -Werror
