:project:
  :name: ZephyrForge Firmware Tests
  :build_root: build/ceedling
  :use_mocks: TRUE
  :release_build: FALSE
  # Disabled modules replace their prototypes with inline stubs, so mocks must see each test's active branch.
  :use_test_preprocessor: :all

:paths:
  :test:
    - +:firmware/tests/unit/**
  :source:
    - firmware/src/**
  :include:
    - firmware/src
    - firmware/src/**
    # Stands in for headers that CMake generates during target builds.
    - firmware/tests/unit/support

# Zephyr glue: covered by target builds and native Zephyr tests, not by host unit tests.
:files:
  :source:
    - -:firmware/src/app/*.c
    - -:firmware/src/platform/*.c
    - -:firmware/src/settings/settings_flash_read.c
    - -:firmware/src/settings/settings_flash_write.c
    - -:firmware/src/benchmark/benchmark_service.c
    - -:firmware/src/benchmark/benchmark_media.c
    - -:firmware/src/storage/storage_service.c
    - -:firmware/src/storage/storage_media.c
    - -:firmware/src/transport/usb_*.c
    - -:firmware/src/transport/ble_gatt.c
    - -:firmware/src/wifi/wifi_station.c
    - -:firmware/src/wifi/wifi_driver.c
    - -:firmware/src/drivers/random_rpi_pico.c
    - -:firmware/src/drivers/sdhc_rpi_pico_pio.c

:defines:
  :test:
    # The Raspberry Pi Pico board build definitions.
    :test_pico_board:
      - ZF_MCU=ZF_MCU_RP2040
      - ZF_BOARD_MODEL=ZF_BOARD_PICO
      - CONFIG_ZF_LED=0
      - CONFIG_ZF_WIFI=0
      - CONFIG_ZF_BLUETOOTH=0
      - CONFIG_ZF_SETTINGS_SAVE=0
      - CONFIG_ZF_STORAGE=0
      - CONFIG_ZF_USB_MSC=0
      - CONFIG_ZF_STORAGE_BENCHMARK=0
    :test_pico_w_board:
      - ZF_MCU=ZF_MCU_RP2040
      - ZF_BOARD_MODEL=ZF_BOARD_PICO_W
      - CONFIG_ZF_LED=0
      - CONFIG_ZF_WIFI=1
      - CONFIG_ZF_BLUETOOTH=0
      - CONFIG_ZF_SETTINGS_SAVE=0
      - CONFIG_ZF_STORAGE=0
      - CONFIG_ZF_USB_MSC=0
      - CONFIG_ZF_STORAGE_BENCHMARK=0
    :test_wifi_disabled:
      - CONFIG_ZF_WIFI=0
    # A hypothetical BLE-only override exercising the radio-mask half of control admission.
    :test_ble_only_board:
      - CONFIG_ZF_LED=0
      - CONFIG_ZF_WIFI=0
      - CONFIG_ZF_BLUETOOTH=1
      - CONFIG_ZF_STORAGE=0
      - CONFIG_ZF_USB_MSC=0
      - CONFIG_ZF_STORAGE_BENCHMARK=0

:cmock:
  :mock_prefix: mock_
  :when_ptr: :compare_ptr
  :plugins:
    - ignore
    - ignore_arg
    - return_thru_ptr
    - expect_any_args
    - callback

:flags:
  :test:
    :compile:
      :*:
        - -std=c11
        - -Wall
        - -Wextra
        - -Werror
        # Board identity defaults; per-test define sets for other boards take precedence.
        - -include firmware/tests/unit/support/board_defaults.h
